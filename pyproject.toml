[project]
name = "scorensic"
version = "0.1.0"
description = "Offline checks that AI benchmark graders accept right answers, reject wrong ones and score consistently."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Maz Works" }]
dependencies = []

[project.scripts]
scorensic = "scorensic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorensic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
